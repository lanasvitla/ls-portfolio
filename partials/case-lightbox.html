<div class="case-lightbox" id="case-lightbox" role="dialog" aria-modal="true" aria-label="{{lightboxLabel}}" hidden>
  <button class="lightbox-close lightbox-control" type="button" aria-label="{{lightboxCloseLabel}}">
    <span aria-hidden="true">&times;</span>
  </button>
  <button class="lightbox-nav lightbox-prev lightbox-control" type="button" aria-label="{{lightboxPrevLabel}}">
    <img class="lightbox-arrow ui-arrow" src="{{assetPrefix}}assets/icons/Arrow_right.svg" alt="" aria-hidden="true" />
  </button>
  <figure class="lightbox-stage">
    <img class="lightbox-image" src="" alt="" />
  </figure>
  <button class="lightbox-nav lightbox-next lightbox-control" type="button" aria-label="{{lightboxNextLabel}}">
    <img class="lightbox-arrow ui-arrow" src="{{assetPrefix}}assets/icons/Arrow_right.svg" alt="" aria-hidden="true" />
  </button>
  <p class="lightbox-count" aria-live="polite"></p>
</div>
